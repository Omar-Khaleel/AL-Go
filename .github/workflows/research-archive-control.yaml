name: Temporary AL-Go Archive Research Control

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: powershell

jobs:
  archive-control:
    if: >-
      github.repository_owner == 'Omar-Khaleel' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/algo-boundary-v2' &&
      github.event.pull_request.title == '[ALGO RESEARCH] Archive extraction boundary control'
    runs-on: windows-latest
    steps:
      - name: Execute safe extraction containment tests
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $root = Join-Path $env:RUNNER_TEMP 'algo-archive-research-control'
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root | Out-Null

          $moduleInfo = Get-Module -ListAvailable Microsoft.PowerShell.Archive |
            Sort-Object Version -Descending |
            Select-Object -First 1

          $tests = @(
            @{ Name = 'dotdot-backslash'; Entry = '..\outside-backslash.txt'; Outside = (Join-Path $root 'outside-backslash.txt') },
            @{ Name = 'dotdot-forwardslash'; Entry = '../outside-forwardslash.txt'; Outside = (Join-Path $root 'outside-forwardslash.txt') },
            @{ Name = 'prefix-sibling'; Entry = '..\destination-sibling\outside-prefix.txt'; Outside = (Join-Path $root 'destination-sibling\outside-prefix.txt') }
          )

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $results = @()

          foreach ($test in $tests) {
            $zipPath = Join-Path $root "$($test.Name).zip"
            $destination = Join-Path $root "$($test.Name)-destination"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null

            $stream = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::Create)
            try {
              $zip = [System.IO.Compression.ZipArchive]::new(
                $stream,
                [System.IO.Compression.ZipArchiveMode]::Create,
                $false
              )
              try {
                $entry = $zip.CreateEntry($test.Entry)
                $writer = [System.IO.StreamWriter]::new($entry.Open())
                try { $writer.Write('SAFE_ARCHIVE_BOUNDARY_MARKER') }
                finally { $writer.Dispose() }

                $insideEntry = $zip.CreateEntry('safe/inside.txt')
                $insideWriter = [System.IO.StreamWriter]::new($insideEntry.Open())
                try { $insideWriter.Write('SAFE_INSIDE_MARKER') }
                finally { $insideWriter.Dispose() }
              }
              finally { $zip.Dispose() }
            }
            finally { $stream.Dispose() }

            $expandSucceeded = $true
            $errorType = ''
            try {
              Expand-Archive -LiteralPath $zipPath -DestinationPath $destination -Force -ErrorAction Stop
            }
            catch {
              $expandSucceeded = $false
              $errorType = $_.Exception.GetType().FullName
            }

            $results += [pscustomobject]@{
              Test = $test.Name
              Entry = $test.Entry
              ExpandSucceeded = $expandSucceeded
              OutsideCreated = (Test-Path -LiteralPath $test.Outside)
              SafeInsideCreated = (Test-Path -LiteralPath (Join-Path $destination 'safe\inside.txt'))
              ErrorType = $errorType
            }
          }

          $resultPath = Join-Path $root 'result.md'
          @(
            '## Safe AL-Go archive extraction control result'
            ''
            "- UTC timestamp: $([DateTime]::UtcNow.ToString('o'))"
            "- Runner OS: $env:RUNNER_OS"
            "- Runner image: $env:ImageOS"
            "- PowerShell version: $($PSVersionTable.PSVersion)"
            "- PowerShell edition: $($PSVersionTable.PSEdition)"
            "- Microsoft.PowerShell.Archive version: $($moduleInfo.Version)"
            "- Microsoft.PowerShell.Archive path: ``$($moduleInfo.Path)``"
            "- Workflow ref: ``$env:GITHUB_WORKFLOW_REF``"
            "- Event merge SHA: ``$env:GITHUB_SHA``"
            ''
            '| Test | Archive entry | Expand succeeded | Outside file created | Safe inside file created | Error type |'
            '|---|---|---:|---:|---:|---|'
          ) | Set-Content -LiteralPath $resultPath -Encoding UTF8

          foreach ($result in $results) {
            $entryValue = $result.Entry.Replace('|', '\|')
            $errorValue = $result.ErrorType.Replace('|', '\|')
            Add-Content -LiteralPath $resultPath -Encoding UTF8 -Value "| $($result.Test) | ``$entryValue`` | $($result.ExpandSucceeded) | $($result.OutsideCreated) | $($result.SafeInsideCreated) | ``$errorValue`` |"
          }

          Add-Content -LiteralPath $resultPath -Encoding UTF8 -Value ''
          Add-Content -LiteralPath $resultPath -Encoding UTF8 -Value 'This control uses only temporary runner files. It does not access repository secrets, GitHub Environments, or external tenant resources.'

          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body-file $resultPath
